stages:
- verify
- deploy

image: ubuntu:18.04
before_script:
  - uname -a

verify:
  stage: verify
  tags:
  - trusted
  script:
  - apt-get -qq update
  - apt-get install -qq -y make zip zlib1g-dev zlibc python ssh rsync python3 git
  - git submodule update --init
  - make db
  # Verify the regenerated databases match what is committed. If they differ,
  # the merge request changed a source DB without regenerating the derived
  # files: run "make db" locally and commit the result.
  - |
    if [ -n "$(git status --porcelain)" ]; then
      echo "Derived database files are out of date."
      echo "Run 'make db' locally and commit the result in your merge request."
      git --no-pager diff
      exit 1
    fi
  - echo "Derived database files are up to date."

boot:
  stage: verify
  # No tag: the tmwa image is built for both amd64 and arm64, and the job
  # needs no credentials, so any runner will do.
  image: ghcr.io/themanaworld/tmwa:latest
  variables:
    GIT_SUBMODULE_STRATEGY: none
  # Boots the map-server against this branch's data. It refuses to start when
  # an NPC script or a database entry fails to parse, which is otherwise only
  # noticed by whoever next runs the server.
  script:
  - .tools/boot-test.sh
  artifacts:
    paths:
    - map-server.log
    when: on_failure
    expire_in: 1 week

evolved:
  stage: deploy
  tags:
  - trusted
  script:
  - apt-get -qq update
  - apt-get install -qq -y make zip zlib1g-dev zlibc python ssh rsync python3 git
  - git config --global credential.helper store
  - echo "https://numa:$SYNC_KEY@git.themanaworld.org" > ~/.git-credentials
  - git clone https://git.themanaworld.org/evolved/serverdata.git evolved
  - cd evolved
  - git checkout master
  - cp -v ../world/map/db/mob_db.conf db/pre-re/
  - cp -v ../world/map/db/item_db.conf db/pre-re/
  - git status
  - (git status --porcelain  | grep '.*') || exit 0 # skip if nothing to commit
  - git config user.email "numa@themanaworld.org"
  - git config user.name "Numa"
  - git commit -a -m "Sync with Legacy repo" --author="Numa <numa@themanaworld.org>"
  - git push
  only:
  - master@tmw/serverdata

clientdata:
  stage: deploy
  tags:
  - trusted
  script:
  - apt-get -qq update
  - apt-get install -qq -y make zip zlib1g-dev zlibc python ssh rsync python3 git
  - git submodule update --init
  - git config --global credential.helper store
  - echo "https://numa:$SYNC_KEY@git.themanaworld.org" > ~/.git-credentials
  - git clone https://git.themanaworld.org/evolved/clientdata.git evolved
  - cd evolved
  - git checkout master
  - cp -v ../client-data/monsters.xml .
  - rm -r graphics/sprites/monsters/*
  - cp -v --recursive ../client-data/graphics/sprites/monsters/* graphics/sprites/monsters/
  - rm -r sfx/*
  - cp -v --recursive ../client-data/sfx/* sfx/
  - git status
  - git config user.email "numa@themanaworld.org"
  - git config user.name "Numa"
  # Stage every path this job copies over. "git add <dir>" also records
  # deletions, so the wiped-and-recopied directories sync both ways.
  - git add monsters.xml graphics/sprites/monsters/ sfx/
  # Having nothing to sync is normal and is not a failure.
  - |
    if git diff --cached --quiet; then
      echo "Nothing to sync."
      exit 0
    fi
  - git commit -m "Sync with Legacy repo" --author="Numa <numa@themanaworld.org>"
  - git push
  only:
  - stable@tmw/serverdata
  allow_failure: true

